# ==============================
# SERVER CONFIG
# ==============================
server.port=8080

# ==============================
# APPLICATION NAME
# ==============================
spring.application.name=api-gateway

# ==============================
# EUREKA CLIENT CONFIG
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==============================
# ENABLE AUTO DISCOVERY ROUTES (NEW KEYS - WebFlux)
# ==============================
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# ==============================
# MANUAL ROUTES (WebFlux Gateway)
# ==============================

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[0].id=inventory-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1


